    <!-- High-Performance Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- PWA Service Worker Registration & Instant Auto-Update (No Hard Refresh Needed) -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        let isRefreshing = false;

        // Auto-refresh page seamlessly when a new service worker version activates
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!isRefreshing) {
            isRefreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');

            // Force check for updates immediately on launch
            reg.update();

            // Check for updates when user returns to the app / switches back tab
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                reg.update();
              }
            });

            // Periodic background check every 15 minutes
            setInterval(() => {
              reg.update();
            }, 15 * 60 * 1000);
          } catch (e) {}
        });
      }
    </script>

    <!-- Main React Bundle -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- TinyAdz Corner Ad -->
    <script src="https://cdn.apitiny.net/scripts/v2.0/main.js" data-site-id="6ad61abfd23e92ca64af1526" data-test-mode="false" async></script>
  </body>
