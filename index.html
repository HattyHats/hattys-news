<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hatty's Crypto — Live Blockchain Intelligence</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f59e0b'/><text x='4' y='24' font-size='22' font-family='serif' fill='black'>₿</text></svg>"/>
<meta name="description" content="Real-time Crypto News. Global blockchain headlines from CoinTelegraph, CoinDesk, and 20+ verified crypto sources."/>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6374033238930580" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{display:['"Bebas Neue"','Impact','sans-serif'],mono:['"IBM Plex Mono"','monospace'],body:['Manrope','system-ui','sans-serif']}}}}</script>

<style>
:root {
  --bg:#050505; --bg2:#0d0d0d; --surface:#111111; --surface2:#1a1a1a;
  --border:#222; --ink:#f0f0f0; --ink-muted:#888; --ink-faint:#3a3a3a;
  --gold:#f59e0b; --gold-b:#fbbf24; --red:#dc2626;
  --glow: 0 0 0 1px rgba(245,158,11,.15), 0 0 20px rgba(0,0,0,.5);
  --glow-h: 0 0 0 1px rgba(245,158,11,.4), 0 0 30px rgba(245,158,11,.1);
  --ticker:#080808; --t:.2s ease; --r:12px;
}
html.light {
  --bg:#f8f8f8; --bg2:#eee; --surface:#ffffff; --surface2:#f1f1f1;
  --border:#ddd; --ink:#111; --ink-muted:#555; --ink-faint:#bbb;
  --gold:#d97706; --gold-b:#b45309;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;min-height:100vh;padding-bottom:80px;transition:background .3s}
html.dark body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);opacity:.2}

/* ── HEADER ── */
#hdr{position:sticky;top:0;z-index:80;background:rgba(5,5,5,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;color:var(--gold);line-height:1}

/* ── INPUTS & BTNS ── */
.inp{background:var(--bg);border:1px solid var(--border);color:var(--ink);padding:.4rem .8rem;border-radius:8px;font-size:.85rem}
.inp:focus{outline:none;border-color:var(--gold)}
.ibtn{background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t)}
.ibtn:hover{border-color:var(--gold);color:var(--gold)}

/* ── DRAWER ── */
#drw{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:200;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#drw.open{transform:translateX(0)}
#ovl{position:fixed;inset:0;z-index:199;background:rgba(0,0,0,.8);opacity:0;pointer-events:none;transition:opacity .3s}
#ovl.open{opacity:1;pointer-events:auto}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--glow);transition:all .25s;animation:fu .4s ease both}
.card:hover{box-shadow:var(--glow-h);border-color:var(--gold);transform:translateY(-4px)}
@keyframes fu{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.ci{width:100%;height:180px;object-fit:cover;background:#1a1a1a}
.cb{padding:1.1rem;flex:1;display:flex;flex-direction:column}
.cs{font-family:'IBM Plex Mono',monospace;font-size:.62rem;font-weight:700;color:var(--gold);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:1px}
.ct{font-weight:800;font-size:1rem;line-height:1.4;margin-bottom:.6rem}
.cd{font-size:.8rem;color:var(--ink-muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rbtn{margin-top:1rem;background:var(--gold);color:#000;padding:.4rem 1rem;border-radius:6px;font-size:.7rem;font-weight:800;text-decoration:none;text-align:center;display:inline-block;transition:transform .2s}
.rbtn:hover{background:var(--gold-b);transform:scale(1.03)}

/* ── FILTER PILLS ── */
.fp{padding:.4rem 1rem;border-radius:99px;font-size:.65rem;font-weight:800;border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);cursor:pointer;white-space:nowrap;font-family:'IBM Plex Mono',monospace;transition:all .2s}
.fp.on,.fp:hover{border-color:var(--gold);background:var(--gold);color:#000}

/* ── CRYPTO TICKER ── */
#tickers{position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--ticker);border-top:1px solid var(--border)}

/* ── SPLASH (KEEPING AS REQUESTED) ── */
#splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1s ease;}
#splash-content{display:flex;flex-direction:column;align-items:center;gap:1.6rem;text-align:center;}
#splash-title{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(2.6rem,10vw,8rem);letter-spacing:.07em;color:#fff;animation:spIn 1.6s ease forwards;text-shadow:0 0 30px var(--red);}
#splash-sub{font-family:'IBM Plex Mono',monospace;font-size:1rem;color:rgba(255,255,255,.5);opacity:0;animation:spIn .9s ease forwards 1.4s;}
@keyframes spIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="splash">
  <div id="splash-content">
    <div id="splash-title">HATTY'S CRYPTO</div>
    <div id="splash-sub">LATEST ON-CHAIN INTELLIGENCE</div>
  </div>
</div>

<div id="ovl"></div>

<header id="hdr">
  <div style="max-width:1400px;margin:0 auto;padding:.7rem 1rem;display:flex;align-items:center;gap:1rem">
    <button class="ibtn" id="ham"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="logo" style="font-size:1.6rem">HATTY'S <span style="color:#fff">CRYPTO</span></div>
    
    <div style="flex:1;display:flex;gap:.5rem">
      <input id="si" type="search" placeholder="Search Bitcoin, Ethereum, DeFi..." class="inp" style="flex:1"/>
    </div>
    
    <button class="ibtn" id="thbtn">☀️</button>
    <button class="ibtn" id="rfbtn">🔄</button>
  </div>
</header>

<main style="max-width:1400px;margin:2rem auto;padding:0 1rem">
  
  <div style="display:flex;gap:.5rem;overflow-x:auto;padding-bottom:1.5rem;scrollbar-width:none" id="cat-bar">
    <button class="fp on" data-cat="all">💎 ALL NEWS</button>
    <button class="fp" data-cat="bitcoin">₿ BITCOIN</button>
    <button class="fp" data-cat="ethereum">Ξ ETHEREUM</button>
    <button class="fp" data-cat="defi">🏦 DEFI</button>
    <button class="fp" data-cat="nft">🎨 NFT/WEB3</button>
    <button class="fp" data-cat="regulation">⚖️ POLICY</button>
  </div>

  <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem"></div>
  <div id="lsp" style="display:none;justify-content:center;padding:4rem"><div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite"></div></div>

</main>

<div id="tickers">
  <script defer src="https://www.livecoinwatch.com/static/lcw-widget.js"></script>
  <div class="livecoinwatch-widget-5" lcw-base="USD" lcw-color-tx="#abb8c3" lcw-marquee-1="coins" lcw-marquee-2="movers" lcw-marquee-items="25"></div>
</div>

<script>
const FEEDS = [
  {n:'CoinTelegraph', u:'https://cointelegraph.com/rss', c:'all'},
  {n:'CoinDesk', u:'https://www.coindesk.com/arc/outboundfeeds/rss/', c:'all'},
  {n:'CryptoSlate', u:'https://cryptoslate.com/feed/', c:'all'},
  {n:'NewsBTC', u:'https://www.newsbtc.com/feed/', c:'bitcoin'},
  {n:'Bitcoin Magazine', u:'https://bitcoinmagazine.com/.rss/full/', c:'bitcoin'},
  {n:'The Block', u:'https://www.theblock.co/rss.xml', c:'all'},
  {n:'Decrypt', u:'https://decrypt.co/feed', c:'nft'},
  {n:'Bankless', u:'https://www.bankless.com/rss.xml', c:'defi'}
];

let state = {
  articles: [],
  filter: 'all',
  query: ''
};

const $ = id => document.getElementById(id);

async function loadNews() {
  $('lsp').style.display = 'flex';
  $('grid').innerHTML = '';
  
  const allData = await Promise.all(FEEDS.map(async feed => {
    try {
      const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(feed.u)}`);
      const xml = await res.text();
      const doc = new DOMParser().parseFromString(xml, 'text/xml');
      const items = Array.from(doc.querySelectorAll('item')).slice(0, 8);
      
      return items.map(item => {
        const desc = item.querySelector('description')?.textContent || '';
        const imgMatch = desc.match(/<img[^>]+src="([^">]+)"/);
        return {
          title: item.querySelector('title')?.textContent,
          link: item.querySelector('link')?.textContent,
          src: feed.n,
          date: item.querySelector('pubDate')?.textContent,
          img: imgMatch ? imgMatch[1] : 'https://images.unsplash.com/photo-1621761191319-c6fb62004040?w=500&auto=format',
          cat: feed.c
        };
      });
    } catch (e) { return []; }
  }));

  state.articles = allData.flat().sort((a,b) => new Date(b.date) - new Date(a.date));
  $('lsp').style.display = 'none';
  render();
}

function render() {
  const filtered = state.articles.filter(a => {
    const matchCat = state.filter === 'all' || a.cat === state.filter || a.title.toLowerCase().includes(state.filter);
    const matchQuery = a.title.toLowerCase().includes(state.query.toLowerCase());
    return matchCat && matchQuery;
  });

  $('grid').innerHTML = filtered.map(a => `
    <article class="card">
      <img src="${a.img}" class="ci" alt="">
      <div class="cb">
        <div class="cs">${a.src}</div>
        <h2 class="ct">${a.title}</h2>
        <div style="flex:1"></div>
        <a href="${a.link}" target="_blank" class="rbtn">READ FULL REPORT</a>
      </div>
    </article>
  `).join('');
}

// Search
$('si').addEventListener('input', e => {
  state.query = e.target.value;
  render();
});

// Categories
document.querySelectorAll('[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    state.filter = btn.dataset.cat;
    render();
  });
});

// Splash logic
setTimeout(() => {
  $('splash').style.opacity = '0';
  setTimeout(() => $('splash').style.display = 'none', 1000);
}, 4000);

// Theme
$('thbtn').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
  $('thbtn').textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
});

$('rfbtn').addEventListener('click', loadNews);

loadNews();
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
