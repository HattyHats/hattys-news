<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hatty's News — Crypto Intelligence</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23dc2626'/><text x='4' y='24' font-size='22' font-family='serif' fill='white'>H</text></svg>"/>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6374033238930580" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{display:['"Bebas Neue"','Impact','sans-serif'],mono:['"IBM Plex Mono"','monospace'],body:['Manrope','system-ui','sans-serif']}}}}</script>

<style>
:root {
  --bg:#050505; --bg2:#0d0d0d; --surface:#111111; --border:#252525; 
  --ink:#f0f0f0; --ink-muted:#888; --red:#dc2626; --red-b:#ef4444;
  --glow: 0 0 20px rgba(220,38,38,0.15);
  --ticker:#080808; --t:.2s ease; --r:10px;
}
html.light {
  --bg:#f4f4f4; --bg2:#e5e5e5; --surface:#ffffff; --border:#d1d1d1;
  --ink:#111; --ink-muted:#555;
}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;min-height:100vh;padding-bottom:80px;}
#hdr{position:sticky;top:0;z-index:80;background:rgba(5,5,5,0.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;color:var(--red);text-shadow:0 0 15px rgba(220,38,38,0.4)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:all .25s;animation:fadeIn .4s ease both}
.card:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:var(--glow)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ci{width:100%;height:170px;object-fit:cover;background:#1a1a1a}
.cb{padding:1rem;flex:1;display:flex;flex-direction:column}
.cs{font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:700;color:var(--red);margin-bottom:.4rem;text-transform:uppercase}
.ct{font-weight:700;font-size:.95rem;line-height:1.4;margin-bottom:.5rem}
.rbtn{background:var(--red);color:#fff;padding:.4rem 1rem;border-radius:4px;font-size:.65rem;font-weight:800;text-decoration:none;display:inline-block;font-family:'IBM Plex Mono',monospace}

/* BUTTONS */
.fp{padding:.4rem 1rem;border-radius:6px;font-size:.65rem;font-weight:800;border:1px solid var(--border);background:var(--bg);color:var(--ink-muted);cursor:pointer;white-space:nowrap;font-family:'IBM Plex Mono',monospace;transition:all .2s}
.fp.on,.fp:hover{border-color:var(--red);background:var(--red);color:#fff}
.ibtn{background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:6px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1s ease;}
#splash-title{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(2.5rem,10vw,7rem);color:#fff;text-shadow:0 0 30px var(--red);animation:spIn 1.5s ease forwards}
@keyframes spIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="splash">
    <div id="splash-title">HATTY'S NEWS</div>
    <div style="font-family:'IBM Plex Mono',monospace;color:rgba(255,255,255,0.4);letter-spacing:4px;margin-top:10px">CRYPTO TERMINAL</div>
</div>

<header id="hdr">
  <div style="max-width:1400px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:1rem">
    <div class="logo" style="font-size:1.5rem">HATTY'S NEWS</div>
    <div style="flex:1">
        <input id="si" type="search" placeholder="Search Blockchain..." class="fp" style="width:100%;text-align:left;cursor:text">
    </div>
    <button class="ibtn" id="thbtn">☀️</button>
    <button class="ibtn" id="rfbtn">🔄</button>
  </div>
</header>

<main style="max-width:1400px;margin:1.5rem auto;padding:0 1rem">
  
  <div style="display:flex;gap:.5rem;overflow-x:auto;padding-bottom:1rem;margin-bottom:1rem;scrollbar-width:none">
    <button class="fp on" data-cat="all">⚡ ALL</button>
    <button class="fp" data-cat="bitcoin">₿ BITCOIN</button>
    <button class="fp" data-cat="ethereum">Ξ ETHEREUM</button>
    <button class="fp" data-cat="defi">🏦 DEFI</button>
    <button class="fp" data-cat="nft">🖼️ NFT/WEB3</button>
    <button class="fp" data-cat="altcoin">🚀 ALTCOINS</button>
    <button class="fp" data-cat="mining">⛏️ MINING</button>
    <button class="fp" data-cat="regulation">⚖️ POLICY</button>
  </div>

  <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem"></div>
  <div id="lsp" style="display:none;justify-content:center;padding:5rem"><div style="width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .6s linear infinite"></div></div>
</main>

<div id="tickers" style="position:fixed;bottom:0;left:0;right:0;z-index:90;background:#080808;border-top:1px solid #222">
  <script defer src="https://www.livecoinwatch.com/static/lcw-widget.js"></script>
  <div class="livecoinwatch-widget-5" lcw-base="USD" lcw-color-tx="#abb8c3" lcw-marquee-1="coins" lcw-marquee-2="movers" lcw-marquee-items="25"></div>
</div>

<script>
// UPDATED SOURCES & CATEGORIES
const FEEDS = [
  {n:'CoinTelegraph', u:'https://cointelegraph.com/rss', c:'all'},
  {n:'CoinDesk', u:'https://www.coindesk.com/arc/outboundfeeds/rss/', c:'all'},
  {n:'Bitcoin Magazine', u:'https://bitcoinmagazine.com/.rss/full/', c:'bitcoin'},
  {n:'NewsBTC', u:'https://www.newsbtc.com/feed/', c:'bitcoin'},
  {n:'Decrypt', u:'https://decrypt.co/feed', c:'nft'},
  {n:'CryptoSlate', u:'https://cryptoslate.com/feed/', c:'altcoin'},
  {n:'The Block', u:'https://www.theblock.co/rss.xml', c:'regulation'},
  {n:'CryptoNews', u:'https://cryptonews.com/news/feed/', c:'altcoin'}
];

let state = { articles: [], filter: 'all', query: '' };
const $ = id => document.getElementById(id);

// NEW: Advanced Fetcher to bypass blocks
async function fetchWithFallback(feed) {
  const encUrl = encodeURIComponent(feed.u);
  
  // Try 1: rss2json (Most reliable for images/formatting)
  try {
    const r = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encUrl}`);
    const d = await r.json();
    if (d.status === 'ok') {
      return d.items.map(i => ({
        title: i.title,
        link: i.link,
        img: i.thumbnail || i.enclosure?.link || 'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=500&auto=format',
        date: new Date(i.pubDate),
        src: feed.n,
        cat: feed.c
      }));
    }
  } catch (e) { console.warn(`rss2json failed for ${feed.n}`); }

  // Try 2: Corsproxy.io (Raw XML)
  try {
    const r = await fetch(`https://corsproxy.io/?${encUrl}`);
    const text = await r.text();
    return parseXML(text, feed);
  } catch (e) { console.warn(`Corsproxy failed for ${feed.n}`); }

  return [];
}

function parseXML(xml, feed) {
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  const items = Array.from(doc.querySelectorAll('item')).slice(0, 8);
  return items.map(item => {
    const desc = item.querySelector('description')?.textContent || '';
    const imgMatch = desc.match(/<img[^>]+src="([^">]+)"/);
    return {
      title: item.querySelector('title')?.textContent || '',
      link: item.querySelector('link')?.textContent || '',
      img: imgMatch ? imgMatch[1] : 'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=500&auto=format',
      date: new Date(item.querySelector('pubDate')?.textContent || Date.now()),
      src: feed.n,
      cat: feed.c
    };
  });
}

async function loadNews() {
  $('lsp').style.display = 'flex';
  $('grid').innerHTML = '';
  
  const results = await Promise.all(FEEDS.map(f => fetchWithFallback(f)));
  state.articles = results.flat().sort((a,b) => b.date - a.date);
  
  $('lsp').style.display = 'none';
  if (state.articles.length === 0) {
    $('grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--ink-muted)">No news found. Try refreshing in a moment.</div>';
  } else {
    render();
  }
}

function render() {
  const filtered = state.articles.filter(a => {
    const matchCat = state.filter === 'all' || a.cat === state.filter || a.title.toLowerCase().includes(state.filter);
    const matchQuery = a.title.toLowerCase().includes(state.query.toLowerCase());
    return matchCat && matchQuery;
  });

  $('grid').innerHTML = filtered.map(a => `
    <article class="card">
      <img src="${a.img}" class="ci" onerror="this.src='https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=500&auto=format'">
      <div class="cb">
        <div class="cs">${a.src} • ${a.date.toLocaleDateString()}</div>
        <h2 class="ct">${a.title}</h2>
        <div style="flex:1"></div>
        <a href="${a.link}" target="_blank" class="rbtn">READ FULL STORY</a>
      </div>
    </article>
  `).join('');
}

// UI HANDLERS
$('si').addEventListener('input', e => { state.query = e.target.value; render(); });
$('rfbtn').addEventListener('click', loadNews);
$('thbtn').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    $('thbtn').textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
});

document.querySelectorAll('[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    state.filter = btn.dataset.cat;
    render();
  });
});

setTimeout(() => {
  $('splash').style.opacity = '0';
  setTimeout(() => $('splash').style.display = 'none', 1000);
}, 3000);

loadNews();
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
