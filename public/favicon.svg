<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a" />
      <stop offset="50%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Terminal Paper Screen Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141726" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#181c2e" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#1a1e33" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e243d" stop-opacity="0" />
    </linearGradient>

    <!-- Code Stream Red Gradient -->
    <linearGradient id="streamRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>

    <!-- Code Stream Cyan Gradient -->
    <linearGradient id="streamCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>

    <!-- Code Stream Gold Gradient -->
    <linearGradient id="streamGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <filter id="neonGlowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ultraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="7" />

  <!-- Ambient Holographic Glows -->
  <circle cx="160" cy="180" r="130" fill="#ef4444" opacity="0.22" filter="blur(45px)" />
  <circle cx="350" cy="340" r="140" fill="#38bdf8" opacity="0.25" filter="blur(50px)" />
  <circle cx="256" cy="270" r="90" fill="#a855f7" opacity="0.15" filter="blur(35px)" />

  <!-- Matrix Background Falling Code Columns (Subtle) -->
  <g font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.12" font-weight="bold">
    <text x="56" y="120">01</text>
    <text x="56" y="145">10</text>
    <text x="56" y="170">01</text>
    <text x="56" y="195">&lt;/&gt;</text>
    <text x="56" y="220">11</text>
    <text x="56" y="245">00</text>
    
    <text x="435" y="180">0x</text>
    <text x="435" y="205">FF</text>
    <text x="435" y="230">01</text>
    <text x="435" y="255">10</text>
    <text x="435" y="280">&lt;1&gt;</text>
    <text x="435" y="305">00</text>
  </g>

  <!-- ==================== DIGITAL NEWS FEED SHEET ==================== -->
  <!-- Top Holographic Newspaper / Tablet Body -->
  <path d="M 120 92 
           C 120 80, 130 70, 142 70 
           L 370 70 
           C 382 70, 392 80, 392 92 
           L 392 270 
           C 392 270, 375 285, 340 280 
           C 300 275, 270 310, 230 295 
           C 190 280, 160 305, 120 285 
           Z" 
        fill="url(#sheetGrad)" 
        stroke="#475569" 
        stroke-width="2.5" 
        opacity="0.95" />

  <!-- Top Glass Sheen Edge -->
  <path d="M 142 72 L 370 72" stroke="url(#rimGrad)" stroke-width="4" filter="url(#neonGlowRed)" stroke-linecap="round" />

  <!-- Feed Header Bar -->
  <rect x="144" y="94" width="224" height="28" rx="6" fill="#0d111d" stroke="#334155" stroke-width="1.5" />
  
  <!-- Live Signal Beacon -->
  <circle cx="162" cy="108" r="4.5" fill="#ef4444" filter="url(#neonGlowRed)" />
  <circle cx="162" cy="108" r="8" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />

  <text x="180" y="112" font-family="monospace" font-size="11" font-weight="900" fill="#f87171" letter-spacing="2">LIVE WIRE // HN</text>

  <!-- News Header Title: "GLOBAL INTEL" -->
  <rect x="144" y="136" width="130" height="12" rx="3" fill="#ffffff" filter="url(#neonGlowCyan)" />
  <rect x="284" y="136" width="84" height="12" rx="3" fill="#38bdf8" opacity="0.8" />

  <!-- News Article Text Lines (Structured) -->
  <rect x="144" y="160" width="224" height="6" rx="2" fill="#94a3b8" opacity="0.8" />
  <rect x="144" y="174" width="190" height="6" rx="2" fill="#64748b" opacity="0.7" />
  <rect x="144" y="188" width="210" height="6" rx="2" fill="#94a3b8" opacity="0.75" />

  <!-- Mid Feed Wire Image Box with Holographic Chart Grid -->
  <rect x="144" y="206" width="95" height="50" rx="5" fill="#090d16" stroke="#2563eb" stroke-width="1.5" />
  <path d="M 152 242 L 168 226 L 184 234 L 204 216 L 228 238" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlowCyan)" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="204" cy="216" r="3" fill="#ffffff" filter="url(#neonGlowCyan)" />

  <!-- Right Side Article Paragraphs -->
  <rect x="252" y="208" width="116" height="5" rx="1.5" fill="#cbd5e1" opacity="0.7" />
  <rect x="252" y="220" width="105" height="5" rx="1.5" fill="#94a3b8" opacity="0.6" />
  <rect x="252" y="232" width="112" height="5" rx="1.5" fill="#cbd5e1" opacity="0.7" />
  <rect x="252" y="244" width="85" height="5" rx="1.5" fill="#64748b" opacity="0.5" />

  <!-- ==================== DISSOLVING INTO GLOWING CODE ==================== -->
  
  <!-- Digital Transition Fracture Line -->
  <path d="M 120 280 Q 210 320 290 275 T 392 285" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" filter="url(#neonGlowCyan)" />

  <!-- Glowing Code Glyphs Dissolving Downward -->
  <!-- Matrix / Code Glyphs stream (Hex & Binary & Syntax) -->
  <g font-family="monospace" font-weight="900" font-size="14" text-anchor="middle">
    <!-- Row 1 Code Flow -->
    <text x="145" y="315" fill="#ffffff" filter="url(#neonGlowCyan)">01</text>
    <text x="180" y="325" fill="#38bdf8" filter="url(#neonGlowCyan)">&lt;div&gt;</text>
    <text x="235" y="318" fill="#f43f5e" filter="url(#neonGlowRed)">0x7F</text>
    <text x="285" y="322" fill="#fbbf24" filter="url(#neonGlowRed)">1010</text>
    <text x="335" y="312" fill="#38bdf8" filter="url(#neonGlowCyan)">{...}</text>
    <text x="375" y="326" fill="#ffffff">01</text>

    <!-- Row 2 Code Flow -->
    <text x="135" y="355" fill="#38bdf8" font-size="16" filter="url(#neonGlowCyan)">1</text>
    <text x="165" y="365" fill="#f43f5e" font-size="13" filter="url(#neonGlowRed)">const</text>
    <text x="215" y="358" fill="#ffffff" font-size="18" filter="url(#ultraGlow)">0101</text>
    <text x="270" y="362" fill="#fbbf24" font-size="15" filter="url(#neonGlowRed)">ETH</text>
    <text x="320" y="355" fill="#38bdf8" font-size="14" filter="url(#neonGlowCyan)">=&gt;</text>
    <text x="365" y="368" fill="#a855f7" font-size="15">BTC</text>

    <!-- Row 3 Code Flow -->
    <text x="150" y="405" fill="#ef4444" font-size="16" filter="url(#neonGlowRed)">0</text>
    <text x="195" y="400" fill="#38bdf8" font-size="17" filter="url(#neonGlowCyan)">1</text>
    <text x="245" y="415" fill="#ffffff" font-size="20" filter="url(#ultraGlow)">&lt;/&gt;</text>
    <text x="300" y="402" fill="#f59e0b" font-size="17" filter="url(#neonGlowRed)">1</text>
    <text x="350" y="410" fill="#38bdf8" font-size="16" filter="url(#neonGlowCyan)">0</text>

    <!-- Row 4 Dissolving Code Streams -->
    <text x="175" y="445" fill="#f87171" font-size="13" opacity="0.8">01</text>
    <text x="225" y="450" fill="#38bdf8" font-size="15" filter="url(#neonGlowCyan)" opacity="0.9">10</text>
    <text x="280" y="452" fill="#ffffff" font-size="16" filter="url(#ultraGlow)">{ }</text>
    <text x="330" y="445" fill="#60a5fa" font-size="13" opacity="0.85">01</text>
  </g>

  <!-- Neon Data Bits & Pixels Floating Away -->
  <g filter="url(#neonGlowCyan)">
    <rect x="130" y="295" width="8" height="8" rx="1.5" fill="#38bdf8" />
    <rect x="250" y="278" width="7" height="7" rx="1" fill="#ffffff" />
    <rect x="365" y="285" width="9" height="9" rx="1.5" fill="#60a5fa" />
    <rect x="170" y="340" width="6" height="6" rx="1" fill="#38bdf8" />
    <rect x="310" y="335" width="7" height="7" rx="1" fill="#ffffff" />
    <rect x="210" y="425" width="8" height="8" rx="1.5" fill="#38bdf8" />
    <rect x="290" y="430" width="6" height="6" rx="1" fill="#93c5fd" />
    <rect x="252" y="460" width="8" height="8" rx="1.5" fill="#ffffff" filter="url(#ultraGlow)" />
  </g>

  <g filter="url(#neonGlowRed)">
    <rect x="205" y="290" width="7" height="7" rx="1" fill="#f43f5e" />
    <rect x="315" y="292" width="8" height="8" rx="1.5" fill="#fbbf24" />
    <rect x="245" y="335" width="9" height="9" rx="1.5" fill="#ef4444" />
    <rect x="345" y="380" width="7" height="7" rx="1" fill="#f59e0b" />
    <rect x="145" y="375" width="6" height="6" rx="1" fill="#f43f5e" />
    <rect x="185" y="420" width="7" height="7" rx="1" fill="#ef4444" />
  </g>

  <!-- Glowing Energy Rays Bursting Out of the Code Base -->
  <line x1="256" y1="310" x2="256" y2="470" stroke="url(#streamCyan)" stroke-width="3" filter="url(#ultraGlow)" />
  <line x1="215" y1="330" x2="200" y2="455" stroke="url(#streamRed)" stroke-width="2.5" filter="url(#neonGlowRed)" />
  <line x1="298" y1="330" x2="310" y2="455" stroke="url(#streamGold)" stroke-width="2.5" filter="url(#neonGlowRed)" />

</svg>